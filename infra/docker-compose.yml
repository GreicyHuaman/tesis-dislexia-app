services:
  postgres:
    image: postgres:16-alpine
    container_name: dyslexia_postgres
    environment:
      POSTGRES_DB: dyslexia_db
      POSTGRES_USER: dyslexia_user
      POSTGRES_PASSWORD: dyslexia_pass_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
    container_name: dyslexia_api
    environment:
      DATABASE_URL: postgresql+psycopg://dyslexia_user:dyslexia_pass_dev@postgres:5432/dyslexia_db
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
